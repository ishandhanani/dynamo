[package]
name = "dynamo-llm-protocol"
description = "Wire contract between Dynamo frontends and workers: preprocessed requests, engine outputs, model deployment card, runtime config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# repo
dynamo-kv-router = { workspace = true }
dynamo-parsers = { workspace = true }
dynamo-protocols = { workspace = true, features = ["protocol-schema"] }
dynamo-renderer = { workspace = true }
dynamo-runtime-protocols = { workspace = true }
dynamo-truthy = { workspace = true }

# workspace
anyhow = { workspace = true }
chrono = { workspace = true }
derive_builder = { workspace = true }
either = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }

base64 = { version = "0.22" }
blake3 = { workspace = true, features = ["mmap", "rayon"] }
bitflags = { version = "2.4", features = ["serde"] }
image = { version = "0.25", features = ["serde"] }
utoipa = { version = "5.3", features = ["rc_schema"] }

[dev-dependencies]
proptest = "1.5"
rmp-serde = "1.3"
serial_test = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
