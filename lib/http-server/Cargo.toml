[package]
name = "dynamo-http-server"
description = "HTTP server mechanics shared by Dynamo frontends and services: listener, accept loop, TLS, write deadlines, graceful shutdown, and the readiness/draining lifecycle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
dynamo-runtime-protocols = { workspace = true }
futures = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "service", "tokio"] }
libc = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
socket2 = { version = "0.5.8", features = ["all"] }
tokio = { workspace = true, features = ["test-util"] }
