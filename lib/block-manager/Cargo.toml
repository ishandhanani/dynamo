[package]
name = "dynamo-block-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo KV Block Manager"

[features]
default = []
# todo(ops): get this working in CI as a default.
# default = ["testing-full"]

testing-full = ["testing-cuda", "testing-nixl"]
testing-cuda = ["dynamo-memory/testing-cuda"]
testing-nixl = ["dynamo-memory/testing-nixl"]
testing-etcd = []
nccl = ["cudarc/nccl"]  # Enable NCCL collective operations
block-manager-bench = ["testing-full", "dep:clap", "dep:indicatif"]

[[bench]]
name = "transfer_context_v2"
harness = false
required-features = ["testing-cuda"]

[[bin]]
name = "bench_local_transfer_v2"
path = "bin/bench_local_transfer_v2.rs"
required-features = ["block-manager-bench"]

[dependencies]
# repo
dynamo-kv-events = { workspace = true }
dynamo-kv-hashing = { workspace = true }
dynamo-memory = { workspace = true }
dynamo-runtime = { workspace = true }

# workspace
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
oneshot = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tmq = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
xxhash-rust = { workspace = true }

aligned-vec = { version = "0.6.4" }
bincode = { version = "2.0.1", features = ["serde", "derive"] }
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
bytemuck = "1.22"
cudarc = { workspace = true }
derive-getters = "0.5"
nix = { version = "0.26" }
nixl-sys = { version = "=1.3.2" }
offset-allocator = "0.2"
rayon = "1"
rmp-serde = "1.3"

# block_manager_bench
clap = { version = "4.5.49", features = ["derive"], optional = true }
indicatif = { version = "0.18.0", optional = true }

[dev-dependencies]
dynamo-runtime = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
assert_matches = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
lazy_static = "1.4"
rstest = "0.18.2"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.17.1"
