[package]
name = "dynamo-vllm-mocker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Mocker-backed implementation of vLLM's native gRPC API"
readme = "README.md"

[[bin]]
name = "dynamo-vllm-mocker-server"
path = "src/main.rs"

[dependencies]
dynamo-mocker = { workspace = true }
dynamo-vllm-sidecar = { path = "../../../sidecar/vllm" }

anyhow = { workspace = true }
async-stream = { workspace = true }
blake3 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-kv-router = { workspace = true, features = ["standalone-selection"] }
dynamo-llm = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
dynamo-runtime = { workspace = true, features = ["etcd", "nats"] }
dynamo-sidecar-common = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
