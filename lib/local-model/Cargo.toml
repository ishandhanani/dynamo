[package]
name = "dynamo-local-model"
description = "Dynamo local model loading stack: LocalModel and its builder, model deployment card loader, model hub download and cache, frontend API config, reasoning field, and request template"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# ModelExpress server client for model downloads; direct download is always available.
modelexpress = ["dep:modelexpress-client"]
# S3 as a LoRA adapter source.
lora-s3 = ["dep:object_store", "dep:aws-config", "dep:aws-credential-types", "dep:aws-types"]

[dependencies]
# repo
dynamo-llm-protocol = { workspace = true }
dynamo-parsers = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-tokenizers = { workspace = true }

# workspace
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hf-hub = { workspace = true, features = ["tokio", "rustls-tls", "ureq"] }
libc = { workspace = true }
modelexpress-client = { workspace = true, optional = true }
modelexpress-common = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# pinned alongside dynamo-llm
aws-config = { version = "1.8.11", optional = true }
aws-credential-types = { version = "1.2.12", optional = true }
aws-types = { version = "1.3.12", optional = true }
object_store = { version = "0.12.4", features = ["aws", "gcp", "azure", "http"], optional = true }
json-five = { version = "0.3" }
tokenizers = { version = "0.21.4", default-features = false, features = [
  "onig",
  "esaxx_fast",
  "rustls-tls",
] }

[target.'cfg(target_os = "linux")'.dependencies]
sysinfo = { workspace = true }

[dev-dependencies]
dynamo-kv-router = { workspace = true }
mockito = "1.7.0"
serial_test = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
