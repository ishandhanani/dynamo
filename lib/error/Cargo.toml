[package]
name = "dynamo-error"
description = "The semantic error contract Dynamo components classify failures with"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# HTTP rendering of the error contract (`dynamo_error::http`): the class-to-status policy and the sanitized response vocabulary. Adds the `http` crate for `StatusCode`.
http = ["dep:http"]

[dependencies]
http = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
