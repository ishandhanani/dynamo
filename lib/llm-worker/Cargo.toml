[package]
name = "dynamo-llm-worker"
description = "Dynamo LLM worker-side runtime: KV event publisher and state agent, worker admission gate, first-token notifier, active-sequence publication, KV source membership, and direct-ZMQ ingress"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables NATS-backed integration tests in the publisher; forwards to dynamo-runtime.
integration = ["dynamo-runtime/integration"]
# Test-only hooks consumed by dependent crates' tests; never enable in release.
testing = []

[dependencies]
# repo
dynamo-kv-router = { workspace = true, features = ["metrics", "runtime-protocols", "standalone-selection"] }
dynamo-llm-protocol = { workspace = true }
dynamo-runtime = { workspace = true }

# workspace
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tmq = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# pinned alongside dynamo-llm
arc-swap = "1.9.1"

[dev-dependencies]
dynamo-protocols = { workspace = true }
dynamo-runtime = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
serial_test = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
