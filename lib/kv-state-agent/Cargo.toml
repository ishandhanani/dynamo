[package]
name = "dynamo-kv-state-agent"
description = "The KV state agent: per-slot agents that turn an engine's raw KV events into router events, the standalone host that multiplexes them, and the worker-side owner of the attachment intents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# repo
dynamo-backend-common = { workspace = true }
dynamo-kv-events = { workspace = true }
dynamo-kv-indexer = { workspace = true }
dynamo-router-protocol = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-sync = { workspace = true }

anyhow = { workspace = true }
arc-swap = "1.9.1"
async-trait = { workspace = true }
blake3 = "1.8"
futures = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `KvStateAgentStatusCell::snapshot`, a test-only handle.
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-kv-hashing = { workspace = true }
rmp-serde = "1.3"
