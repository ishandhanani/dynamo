[package]
name = "dynamo-kv-router"
description = "Facade over the Dynamo router crates; removed in the next step of the router split"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
metrics = ["dynamo-scheduler/metrics"]
bench = ["dynamo-scheduler/bench"]
profile = ["dynamo-scheduler/profile"]
standalone-indexer = ["dynamo-kv-indexer/http"]
standalone-slot-tracker = ["dynamo-slot-tracker/http"]
standalone-selection = ["standalone-indexer", "dynamo-scheduler/http"]
testing = ["dynamo-scheduler/testing"]

[dependencies]
dynamo-router-types = { workspace = true }
dynamo-kv-indexer = { workspace = true }
dynamo-slot-tracker = { workspace = true }
dynamo-admission = { workspace = true }
dynamo-worker-selection = { workspace = true }
dynamo-scheduler = { workspace = true }

[dev-dependencies]
dynamo-scheduler = { workspace = true, features = ["testing", "http"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tempfile = { workspace = true }
