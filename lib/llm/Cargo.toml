[package]
name = "dynamo-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo LLM Library"

[features]
default = ["block-manager"]
# todo(ops): get this working in CI as a default.
# default = ["block-manager", "testing-full"]

testing-full = ["testing-cuda", "testing-nixl"]
testing-cuda = ["dep:cudarc", "dynamo-memory/testing-cuda"]
testing-nixl = ["dep:nixl-sys", "dynamo-memory/testing-nixl"]
testing-etcd = []
# Forward the NVTX feature to dynamo-runtime (build with --features nvtx or dynamo-llm/nvtx)
nvtx = ["dynamo-runtime/nvtx"]
block-manager = ["dep:nixl-sys", "dep:cudarc", "dep:nix", "dep:aligned-vec"]
nccl = ["dep:cudarc", "cudarc/nccl"]  # Enable NCCL collective operations
block-manager-bench = ["block-manager", "testing-full", "dep:clap", "dep:indicatif"]
cuda = ["dep:cudarc"]
integration = ["dynamo-runtime/integration"]
# Frontend video decoding, which lives in dynamo-preprocessor; that crate turns on the
# matching feature of the protocols and the model card.
media-ffmpeg = ["dynamo-preprocessor/media-ffmpeg"]
bench = ["dynamo-kv-router/bench"]
# Pull-only CKF Relay stats and snapshots. Keep this separate from `metrics`, which
# is enabled by normal `dynamo-llm` builds and must not retain diagnostic hot-path work.
ckf-diagnostics = ["dynamo-sync/ckf-diagnostics"]
kv-router-stress = ["dep:clap", "dep:indicatif", "bench"]
# Multimodal-aware KV routing info, which the preprocessor in dynamo-preprocessor builds.
mm-routing = ["dynamo-preprocessor/mm-routing"]
request-trace-bench = ["dynamo-telemetry/request-trace-bench"]
# S3 destination for the request-trace sink, which lives in dynamo-telemetry.
request-trace-s3 = ["dynamo-telemetry/request-trace-s3"]

[[bench]]
name = "transfer_context_v2"
harness = false
required-features = ["block-manager", "testing-cuda"]

[[bench]]
name = "kv_router_bench"
harness = false
required-features = ["kv-router-stress"]

[[bench]]
name = "request_trace_finish_metadata"
harness = false
required-features = ["request-trace-bench"]

[dependencies]
dynamo-router-policies = { workspace = true }
dynamo-frontend-protocols = { workspace = true }
# repo
dynamo-http-server = { workspace = true }
dynamo-global-discovery-client = { workspace = true }
dynamo-admission = { workspace = true }
dynamo-global-common = { workspace = true, features = ["grpc"] }
dynamo-global-view-broadcaster = { path = "../global-view-broadcaster" }
dynamo-error = { workspace = true, features = ["http"] }
dynamo-kv-events = { workspace = true }
dynamo-kv-hashing = { workspace = true }
dynamo-kv-hints = { workspace = true }
dynamo-kv-indexer = { workspace = true, features = ["export"] }
dynamo-kv-router = { workspace = true, features = ["metrics"] }
dynamo-lora = { workspace = true }
dynamo-model-card = { workspace = true }
dynamo-preprocessor = { workspace = true }
dynamo-router-protocol = { workspace = true }
dynamo-scheduler = { workspace = true }
dynamo-session-affinity = { workspace = true }
dynamo-slot-tracker = { workspace = true }
dynamo-sync = { workspace = true }
dynamo-telemetry = { workspace = true }
dynamo-worker-selection = { workspace = true }
dynamo-memory = { workspace = true }
dynamo-mocker = { workspace = true, features = ["zmq-events"] }
dynamo-rl = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-tokenizers = { workspace = true }
dynamo-renderer = { workspace = true }

# workspace
anyhow = { workspace = true }
arc-swap = "1.9.1"
dynamo-protocols = { workspace = true, features = ["protocol-schema"] }
dynamo-decisions = { workspace = true }
dynamo-parsers = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
half = { version = "2", features = ["serde", "num-traits"] }
hf-hub = { workspace = true, features = ["tokio", "rustls-tls", "ureq"] }
http-body-util = "0.1"
libc = { workspace = true }
oneshot = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
tmq = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
zmq = { workspace = true }


blake3 = { version = "1.8", features = ["mmap", "rayon"] }
bytemuck = "1.22"
derive-getters = "0.5"
offset-allocator = "0.2"
rayon = "1"
bincode = { version = "2.0.1", features = ["serde", "derive"] }


# input/text
dialoguer = { version = "0.11", default-features = false, features = [
  "editor",
  "history",
] }

# block_manager
aligned-vec = { version = "0.6.4", optional = true }
nixl-sys = { version = "=1.3.2", optional = true }
cudarc = { workspace = true, optional = true }
nix = { version = "0.26", optional = true }

# block_manager_bench
clap = { version = "4.5.49", features = ["derive"], optional = true }
indicatif = { version = "0.18.0", optional = true }

# http-service
axum = { workspace = true, features = ["multipart"] }
mime = "0.3"
tokio-rustls = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
utoipa = { version = "5.3", features = ["axum_extras", "rc_schema", "preserve_order"] }
# Depends on utoipa 6; openapi_docs.rs passes it only the spec URL, so utoipa 5 above is unaffected.
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }


# grpc-service
# ping version to 0.13.1 so it depends on prost 0.13.5
# which is used across other libraries
tonic = { version = "0.13.1", features = ["zstd"] }
tonic-health = { workspace = true }
tonic-reflection = { version = "0.13.1" }
# Request prost specifically so tonic-build properly compiles protobuf message
prost = { version = "0.13.5" }

# tokenizers
tokenizers = { version = "0.23.2", default-features = false, features = [
  "onig",
  "esaxx_fast",
  "rustls-tls",
] }

# preprocessor
# "preserve_order" backs minijinja's object values with IndexMap instead of
# BTreeMap, so JSON object keys survive template rendering in client order.
# Without it, tool schemas and tool-call arguments render with keys sorted
# alphabetically, diverging from Python frontends (vLLM/SGLang) which preserve
# dict insertion order. serde_json already has its preserve_order enabled by
# dynamo-renderer; minijinja's map is the remaining sort point.
minijinja = { version = "2.21.0", features = ["loader", "loop_controls", "preserve_order"] }

# media loading in the preprocessor
reqwest = { workspace = true }
base64 = { version = "0.22" }
image = { version = "0.25", features = ["serde"] }

# Publishers
rmp-serde = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
sysinfo = { workspace = true }

[dev-dependencies]
dynamo-frontend-protocols = { workspace = true, features = ["testing"] }
dynamo-preprocessor = { workspace = true, features = ["testing"] }
dynamo-sync = { workspace = true, features = ["testing"] }
dynamo-lora = { workspace = true, features = ["testing"] }
dynamo-kv-router = { workspace = true, features = ["testing"] }
dynamo-runtime = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
assert_matches = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
hf-hub = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rstest = "0.18.2"
serial_test = "3"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.17.1"
tracing-subscriber = { workspace = true }
insta = { version = "1.41", features = [
  "glob",
  "json",
  "redactions",
  "filters",
] }
proptest = "1.5"

lazy_static = "1.4"
mockito = "1.7.0"
dynamo-bench = { path = "../bench", default-features = false, features = [
  "kv-router-stress-support",
] }
tokio-tungstenite = "0.26"

[[bin]]
name = "generate-frontend-openapi"
path = "src/bin/generate_frontend_openapi.rs"

[build-dependencies]
tonic-build = { version = "0.13.1" }

[[bin]]
name = "bench_local_transfer_v2"
path = "bin/bench_local_transfer_v2.rs"
required-features = ["block-manager-bench"]
