[package]
name = "dynamo-selection-catalog-feeder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Mirrors Ready Kubernetes pods into a Dynamo selection-service catalog over HTTP"

[[bin]]
name = "dynamo-selection-catalog-feeder"
path = "src/main.rs"

[dependencies]
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
axum = { workspace = true }
dynamo-kv-router = { workspace = true, features = ["standalone-selection"] }
