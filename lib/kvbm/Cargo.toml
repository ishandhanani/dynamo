[package]
name = "dynamo-kvbm"
description = "Dynamo KV block manager: tiered KV cache blocks across GPU, host, disk, and remote memory with NIXL transfers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
# Enable NCCL collective operations for replicated mode.
nccl = ["cudarc/nccl"]
testing-full = ["testing-cuda", "testing-nixl"]
testing-cuda = ["dynamo-memory/testing-cuda"]
testing-nixl = ["dynamo-memory/testing-nixl"]
testing-etcd = []
bench = ["testing-full", "dep:clap", "dep:indicatif"]

[[bin]]
name = "bench_local_transfer_v2"
path = "bin/bench_local_transfer_v2.rs"
required-features = ["bench"]

[[bench]]
name = "transfer_context_v2"
harness = false
required-features = ["testing-cuda"]

[dependencies]
dynamo-kv-router = { workspace = true }
dynamo-llm-protocol = { workspace = true }
dynamo-memory = { workspace = true }
dynamo-runtime = { workspace = true }

aligned-vec = { version = "0.6.4" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bincode = { version = "2.0.1", features = ["serde", "derive"] }
blake3 = { workspace = true }
bytemuck = "1.22"
bytes = { workspace = true }
clap = { version = "4.5.49", features = ["derive"], optional = true }
cudarc = { workspace = true }
derive-getters = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
indicatif = { version = "0.18.0", optional = true }
nix = { version = "0.26" }
nixl-sys = { version = "=1.3.2" }
offset-allocator = "0.2"
oneshot = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
rayon = "1"
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tmq = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
assert_matches = "1.5"
lazy_static = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.18.2"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = { workspace = true }
