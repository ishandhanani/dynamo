[package]
name = "dynamo-sglang-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo SGLang sidecar for an out-of-process engine exposed through its native gRPC service."

[package.metadata.cargo-machete]
# prost, prost-types: referenced by protobuf code generated into OUT_DIR.
# dynamo-preprocessor: no source names it; the `mm-routing` feature below forwards to it.
ignored = ["prost", "prost-types", "dynamo-preprocessor"]

[[bin]]
name = "dynamo-sglang-sidecar"
path = "src/main.rs"

[features]
# On for the sidecar image's SBOM (its shared build links vLLM's mm-routing here).
# The Python bindings turn them off so the default wheel stays lean.
default = ["mm-routing", "jemalloc"]
mm-routing = ["dynamo-preprocessor/mm-routing"]
# jemalloc as the binary's global allocator.
jemalloc = ["dynamo-sidecar-common/jemalloc"]

[dependencies]
dynamo-sglang-generate = { workspace = true }
dynamo-backend-common = { workspace = true }
# For the `mm-routing` forward only: the frontend crate behind dynamo-sglang-generate links the
# preprocessor into this binary, and the feature's code is the preprocessor's.
dynamo-preprocessor = { workspace = true }
dynamo-sync = { workspace = true }
dynamo-frontend-protocols = { workspace = true }
dynamo-model-card = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-kv-events = { workspace = true }
rmp-serde = { workspace = true }
tempfile = { workspace = true }
tmq = { workspace = true }
tracing-subscriber = { workspace = true }
