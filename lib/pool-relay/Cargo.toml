[package]
name = "dynamo-pool-relay"
description = "The Dynamo Pool Relay: endpoint-local CKF pools, pool identity and topology, serving load, and the gRPC stream a global router reads"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Pull-only CKF Relay stats and snapshots. The Python bindings forward their own
# ckf-diagnostics feature here; this one turns on the worker query client's in dynamo-sync.
ckf-diagnostics = ["dynamo-sync/ckf-diagnostics"]

[dependencies]
# repo
dynamo-global-common = { workspace = true, features = ["grpc"] }
dynamo-global-discovery-client = { workspace = true }
dynamo-global-view-broadcaster = { path = "../global-view-broadcaster" }
dynamo-http-server = { workspace = true }
dynamo-kv-events = { workspace = true }
dynamo-kv-hashing = { workspace = true }
dynamo-kv-indexer = { workspace = true }
dynamo-model-card = { workspace = true }
dynamo-router-protocol = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-slot-tracker = { workspace = true }
dynamo-sync = { workspace = true }

# workspace
anyhow = { workspace = true }
arc-swap = "1.9.1"
async-stream = { workspace = true }
async-trait = { workspace = true }
blake3 = "1.8"
bytes = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
oneshot = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xxhash-rust = { workspace = true }

# The relay's gRPC stream. tonic is pinned to 0.13.1 so it depends on prost 0.13.5,
# which is used across other libraries.
tonic = { version = "0.13.1", features = ["zstd"] }
tonic-health = { workspace = true }
tonic-reflection = { version = "0.13.1" }
# Request prost specifically so tonic-build properly compiles protobuf message
prost = { version = "0.13.5" }

[dev-dependencies]
dynamo-sync = { workspace = true, features = ["testing"] }
rmp-serde = "1.3"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tonic-build = { version = "0.13.1" }
