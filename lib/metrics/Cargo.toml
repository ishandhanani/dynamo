[package]
name = "dynamo-metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Prometheus metrics the Dynamo way: metric names and label rules, the hierarchy that names and labels a metric, the registry tree, and scrape-time collection from stage counters"

[features]
default = []
# Exposition-text helpers for dependants' tests; never enable in release.
testing = []

[dependencies]
anyhow = { workspace = true }
once_cell = { version = "1" }
parking_lot = { workspace = true }
prometheus = { workspace = true }
regex = { version = "1" }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = "0.5"
serde_json = { workspace = true }

[[bench]]
name = "gather"
harness = false
