[package]
name = "dynamo-worker-selection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Worker selection for the Dynamo router: eligibility, the selection plugin API, the composed policy, LoRA narrowing, conditional disaggregation, session affinity, and the shipped policies"

[features]
default = []
bench = ["dynamo-router-protocol/bench"]
# Test hooks consumed by dependent crates' tests; never enable in release.
testing = ["dynamo-router-protocol/testing"]

[dependencies]
dynamo-router-protocol = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
dashmap = { workspace = true }
fastrand = "2"
serde = { workspace = true }
serde_yaml = "0.9.34"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = "2.1.1"

[dev-dependencies]
dynamo-router-protocol = { workspace = true, features = ["testing"] }
criterion = "0.5"
dynamo-slot-tracker = { workspace = true, features = ["bench"] }
rstest = "0.18.2"
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
serde_json = { workspace = true }

[[bench]]
name = "worker_selection"
harness = false
required-features = ["bench"]
