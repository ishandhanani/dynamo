[package]
name = "dynamo-kv-hints"
description = "KV transfer hints the router hands engines: the wire, the source choice, and the worker transfer keys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[features]
# The hint sockets; only dynamo-llm enables it.
zmq = ["dep:zmq", "dep:rmp-serde", "dep:tracing"]

[dependencies]
dynamo-kv-hashing = { workspace = true }
dynamo-kv-indexer = { workspace = true }
dynamo-router-protocol = { workspace = true }
rustc-hash = "2.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zmq = { workspace = true, optional = true }
