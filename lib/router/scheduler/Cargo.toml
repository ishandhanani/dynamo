[package]
name = "dynamo-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The Dynamo router scheduler: the selection kernel, the plugin registry, SelectionCore/SelectionService, and the nested router configuration"

[features]
default = []
metrics = ["dep:prometheus", "dynamo-kv-indexer/metrics"]
bench = [
  "dynamo-router-types/bench",
  "dynamo-kv-indexer/bench",
  "dynamo-slot-tracker/bench",
  "dynamo-worker-selection/bench",
  "dynamo-admission/bench",
]
profile = ["dynamo-kv-indexer/profile"]
# The selection HTTP service (axum itself is always linked; the routes are behind this gate).
http = ["dynamo-slot-tracker/http"]
# Test hooks consumed by dependent crates' tests; never enable in release.
testing = ["dynamo-worker-selection/testing", "dynamo-kv-indexer/testing", "dynamo-slot-tracker/testing"]

[dependencies]
dynamo-router-types = { workspace = true }
dynamo-kv-indexer = { workspace = true, features = ["http"] }
dynamo-slot-tracker = { workspace = true, features = ["replica-sync-zmq"] }
dynamo-admission = { workspace = true }
dynamo-worker-selection = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9.34"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
crossbeam-queue = "0.3"
parking_lot = { workspace = true }
rustc-hash = "2.1.1"
dynamo-tokens = { workspace = true }
once_cell = { version = "1" }
prometheus = { workspace = true, optional = true }
axum = { version = "=0.8.4", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "query",
  "tokio",
  "tracing",
] }

[dev-dependencies]
dynamo-router-types = { workspace = true, features = ["testing"] }
dynamo-kv-indexer = { workspace = true, features = ["testing"] }
dynamo-slot-tracker = { workspace = true, features = ["testing"] }
dynamo-worker-selection = { workspace = true, features = ["testing"] }
criterion = "0.5"
rstest = "0.18.2"
rstest_reuse = "0.7.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "selection_core"
harness = false
required-features = ["bench"]
