[package]
name = "dynamo-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The Dynamo router kernel: SelectionCore runs the stages atomically for one request. Composition (SelectionService, plugins, config, servers) lives in dynamo-kv-router"

[features]
default = []
bench = [
  "dynamo-router-types/bench",
  "dynamo-kv-indexer/bench",
  "dynamo-slot-tracker/bench",
  "dynamo-worker-selection/bench",
  "dynamo-admission/bench",
]
profile = ["dynamo-kv-indexer/profile"]
# Test hooks consumed by dependent crates' tests; never enable in release.
testing = ["dynamo-worker-selection/testing", "dynamo-kv-indexer/testing", "dynamo-slot-tracker/testing"]

[dependencies]
dynamo-router-types = { workspace = true }
dynamo-kv-indexer = { workspace = true, features = ["ingest-zmq"] }
dynamo-slot-tracker = { workspace = true, features = ["replica-sync-zmq"] }
dynamo-admission = { workspace = true }
dynamo-worker-selection = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
arc-swap = "1.9.1"
crossbeam-queue = "0.3"
parking_lot = { workspace = true }
rustc-hash = "2.1.1"
dynamo-tokens = { workspace = true }
once_cell = { version = "1" }

[dev-dependencies]
dynamo-router-types = { workspace = true, features = ["testing"] }
dynamo-kv-indexer = { workspace = true, features = ["testing"] }
dynamo-slot-tracker = { workspace = true, features = ["testing"] }
dynamo-worker-selection = { workspace = true, features = ["testing"] }
criterion = "0.5"
rstest = "0.18.2"
rstest_reuse = "0.7.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[[bench]]
name = "selection_core"
harness = false
required-features = ["bench"]
